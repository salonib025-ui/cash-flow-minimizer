<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cash Flow Minimizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>💰 Cash Flow Minimizer</h1>

        <!-- Number of People -->
        <div class="card">
            <label>Enter number of people:</label>
            <input type="number" id="numPeople">
            <button onclick="createInputs()">Next</button>
        </div>

        <!-- Names Input -->
        <div id="namesSection" class="card hidden"></div>

        <!-- Matrix Input -->
        <div id="matrixSection" class="card hidden"></div>

        <!-- Result -->
        <div id="resultSection" class="card hidden">
            <h2>Optimized Transactions</h2>
            <ul id="resultList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
